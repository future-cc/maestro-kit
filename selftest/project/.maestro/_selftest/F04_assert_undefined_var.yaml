# expect: fail:assertion_failed
# timeout: 90
# note: assertTrue 条件里引用未定义变量：Maestro 2.11 把 JS 异常吞成“假”，所以只会是断言失败而不是脚本错误（FINDINGS M31）
appId: com.android.settings
---
- launchApp:
    label: 启动设置
- extendedWaitUntil:
    label: 等首屏标题
    visible:
      id: "homepage_title"
    timeout: 15000
- assertTrue:
    label: 引用未定义变量
    condition: ${NOT_DEFINED_ANYWHERE == 1}
- takeScreenshot: f04_unreachable
